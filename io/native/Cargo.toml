[package]
name = "io-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
io-core = { path = "../core" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "net", "macros"] }
axum = "=0.8.9"
reqwest = { version = "=0.13.4", default-features = false, features = ["stream"] }
futures-util.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
